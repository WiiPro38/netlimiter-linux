[package]
name = "netlimiterd"
version = "0.1.0"
edition = "2021"
description = "NetLimiter-style per-application bandwidth daemon for Fedora"
license = "MIT"

[[bin]]
name = "netlimiterd"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
